<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">FACT versus CLAIM contradiction example</title>
  <desc id="desc">Trusted FACT object how SMBv1 handled crafted requests conflicts with an over-expanded CLAIM object; CLAIM labeled CONTRADICTED; FACT retained; feedback sent to LLM.</desc>
  <defs>
    <style>
      .t { font-family: Georgia, serif; font-size: 13px; fill: #222; }
      .h { font-family: Georgia, serif; font-size: 17px; font-weight: 700; fill: #111; }
      .c { font-family: Georgia, serif; font-size: 11px; fill: #333; }
      .fact { fill: #D9F0D9; stroke: #3B7A3B; stroke-width: 1.5; }
      .claim { fill: #F5D0D0; stroke: #8A3B3B; stroke-width: 1.5; }
      .py { fill: #D9E8F5; stroke: #3B6A8A; stroke-width: 1.5; }
      .arrow { stroke: #444; fill: none; stroke-width: 1.5; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="560" fill="#FAFAF8"/>
  <text x="20" y="28" class="h">Figure: FACT / CLAIM contradiction (WannaCry Q2)</text>
  <text x="20" y="48" class="c">Exact triples and reason from &70a052a7.jsonl. Layout simplified. Alternate Apollo-complex occurrence_date example in ALGORITHM_WORKED_EXAMPLES.md.</text>

  <rect x="40" y="70" width="380" height="130" class="fact"/>
  <text x="55" y="95" class="t">Trusted FACT (retained)</text>
  <text x="55" y="120" class="t">Microsoft Security Bulletin MS17-010</text>
  <text x="55" y="142" class="t"> supplied_correction_to_vulnerability ’</text>
  <text x="55" y="164" class="t">how SMBv1 handled crafted requests</text>

  <rect x="480" y="70" width="380" height="130" class="claim"/>
  <text x="495" y="95" class="t">CLAIM (from model answer)</text>
  <text x="495" y="120" class="t">Microsoft Security Bulletin MS17-010</text>
  <text x="495" y="142" class="t"> supplied_correction_to_vulnerability ’</text>
  <text x="495" y="164" class="t">&allowing remote code execution&</text>

  <path class="arrow" d="M230,200 V230"/>
  <path class="arrow" d="M670,200 V230"/>

  <rect x="150" y="230" width="600" height="90" class="py"/>
  <text x="170" y="260" class="t">Comparison condition (Python GraphComparator, legacy path):</text>
  <text x="170" y="285" class="t">same normalized subject + same relation + different object ’ CONTRADICTED</text>
  <text x="170" y="305" class="t">Neo4j does not compute this label; it may store it on a CREATE :CLAIM edge.</text>

  <path class="arrow" d="M450,320 V350"/>

  <rect x="80" y="350" width="740" height="100" class="py"/>
  <text x="100" y="380" class="t">Exact reason stored/logged:</text>
  <text x="100" y="405" class="t">Claim object 'allowing remote code execution when specially crafted SMBv1 messages were sent'</text>
  <text x="100" y="425" class="t">conflicts with KGc fact 'how SMBv1 handled crafted requests' for relation</text>
  <text x="100" y="445" class="t">'supplied_correction_to_vulnerability'.</text>

  <path class="arrow" d="M450,450 V475"/>
  <rect x="80" y="475" width="740" height="50" class="py"/>
  <text x="100" y="505" class="t">Feedback to LLM: preserve SUPPORTED claims; correct CONTRADICTED using the conflicting FACT. CLAIM is never rewritten as FACT.</text>

  <text x="20" y="545" class="c">Caption: Qualitative WannaCry execution  not pooled with Apollo n=50 statistics.</text>
</svg>
