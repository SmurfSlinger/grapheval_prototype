<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" role="img" aria-labelledby="title desc">
  <title id="title">GraphEval algorithm overview</title>
  <desc id="desc">Simplified conceptual flow: LLM stages, deterministic Python, Neo4j reads and writes, then post-inference scoring.</desc>
  <defs>
    <style>
      .box { stroke-width: 1.5; }
      .llm { fill: #F5E6C8; stroke: #8A6D3B; }
      .py { fill: #D9E8F5; stroke: #3B6A8A; }
      .nj { fill: #D9F0D9; stroke: #3B7A3B; }
      .post { fill: #EDEDED; stroke: #666; }
      .t { font-family: Georgia, serif; font-size: 13px; fill: #222; }
      .h { font-family: Georgia, serif; font-size: 18px; font-weight: 700; fill: #111; }
      .c { font-family: Georgia, serif; font-size: 11px; fill: #333; }
      .lane { fill: none; stroke: #999; stroke-dasharray: 4 3; }
      .arrow { stroke: #444; stroke-width: 1.4; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#444"/></marker>
  </defs>
  <rect width="920" height="640" fill="#FAFAF8"/>
  <text x="24" y="32" class="h">Figure: GraphEval algorithm overview</text>
  <text x="24" y="52" class="c">Simplified conceptual view of DecomposedBacktrackingRunner. Exact schema: neo4j_logical_schema.</text>

  <rect x="20" y="70" width="210" height="480" class="lane"/>
  <text x="30" y="90" class="t">LLM</text>
  <rect x="35" y="110" width="180" height="40" class="box llm"/><text x="45" y="135" class="t">Optional question split</text>
  <rect x="35" y="170" width="180" height="40" class="box llm"/><text x="45" y="195" class="t">Context FACT extract</text>
  <rect x="35" y="290" width="180" height="40" class="box llm"/><text x="45" y="315" class="t">Answer / projection</text>
  <rect x="35" y="350" width="180" height="40" class="box llm"/><text x="45" y="375" class="t">CLAIM extraction</text>
  <rect x="35" y="470" width="180" height="40" class="box llm"/><text x="45" y="495" class="t">Answer revision</text>

  <rect x="250" y="70" width="230" height="480" class="lane"/>
  <text x="260" y="90" class="t">Deterministic Python</text>
  <rect x="265" y="110" width="200" height="40" class="box py"/><text x="275" y="135" class="t">Validate triples / split</text>
  <rect x="265" y="230" width="200" height="40" class="box py"/><text x="275" y="255" class="t">Schema alignment</text>
  <rect x="265" y="290" width="200" height="40" class="box py"/><text x="275" y="315" class="t">GraphComparator labels</text>
  <rect x="265" y="350" width="200" height="40" class="box py"/><text x="275" y="375" class="t">Target + evidence path</text>
  <rect x="265" y="410" width="200" height="40" class="box py"/><text x="275" y="435" class="t">Stop reason / feedback</text>
  <rect x="265" y="510" width="200" height="40" class="box py"/><text x="275" y="535" class="t">Combine sub-answers</text>

  <rect x="500" y="70" width="230" height="480" class="lane"/>
  <text x="510" y="90" class="t">Neo4j</text>
  <rect x="515" y="170" width="200" height="40" class="box nj"/><text x="525" y="195" class="t">WRITE MERGE :FACT</text>
  <rect x="515" y="230" width="200" height="40" class="box nj"/><text x="525" y="255" class="t">READ FACTs (optional)</text>
  <rect x="515" y="470" width="200" height="40" class="box nj"/><text x="525" y="495" class="t">WRITE CREATE :CLAIM</text>
  <rect x="515" y="510" width="200" height="40" class="box nj"/><text x="525" y="535" class="t">WRITE working :FACT</text>

  <rect x="750" y="70" width="150" height="480" class="lane"/>
  <text x="760" y="90" class="t">Post-inference</text>
  <rect x="760" y="290" width="130" height="80" class="box post"/><text x="770" y="320" class="t">Score vs</text><text x="770" y="340" class="t">expected</text><text x="770" y="360" class="t">(not in runner)</text>

  <path class="arrow" d="M215,130 H265"/>
  <path class="arrow" d="M215,190 H515"/>
  <path class="arrow" d="M715,190 H715,250 H515"/>
  <path class="arrow" d="M215,310 H265"/>
  <path class="arrow" d="M215,370 H265"/>
  <path class="arrow" d="M465,430 H215,490"/>
  <path class="arrow" d="M465,450 H515,490"/>
  <path class="arrow" d="M465,530 H515"/>
  <path class="arrow" d="M715,530 H760,330"/>

  <text x="24" y="580" class="c">Caption: Live path for scripts/run_multihop_benchmark.py � DecomposedBacktrackingRunner.</text>
  <text x="24" y="598" class="c">CLAIM writes append per iteration; labels are computed in Python then stored. Expected answers used only in post-inference scoring.</text>
  <text x="24" y="616" class="c">Legend: tan = LLM; blue = Python; green = Neo4j; gray = post-inference scoring.</text>
</svg>
